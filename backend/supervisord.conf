[unix_http_server]
file=/tmp/contact-outreach/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/contact-outreach/supervisord.pid
childlogdir=/tmp/contact-outreach

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/contact-outreach/supervisor.sock

[program:api]
command=uvicorn contact_outreach.asgi:application --host 0.0.0.0 --port %(ENV_PORT)s --workers %(ENV_WEB_CONCURRENCY)s --timeout-graceful-shutdown 90 --no-access-log
directory=/app
priority=10
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=90
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker-general]
command=celery -A contact_outreach worker --loglevel=%(ENV_CELERY_LOG_LEVEL)s --hostname=worker@%%h --queues=default,delivery,mailbox,analysis,extraction,automation --concurrency=%(ENV_CELERY_WORKER_CONCURRENCY)s --prefetch-multiplier=1
directory=/app
priority=20
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=90
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker-maintenance]
command=celery -A contact_outreach worker --loglevel=%(ENV_CELERY_LOG_LEVEL)s --hostname=maintenance@%%h --queues=maintenance --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=1
directory=/app
priority=30
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=90
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:beat]
command=celery -A contact_outreach beat --loglevel=%(ENV_CELERY_LOG_LEVEL)s --pidfile=/tmp/contact-outreach/celerybeat.pid --schedule=/tmp/contact-outreach/celerybeat-schedule
directory=/app
priority=40
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
